<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>阅读探险 · Reading Quest</title>
<meta name="description" content="给孩子的游戏化阅读探险：点亮主题、收集文体印章，在故事里拓宽阅读边界。无需注册，进度保存在本设备。">
<meta property="og:title" content="阅读探险 · Reading Quest">
<meta property="og:description" content="给孩子的游戏化阅读探险：点亮主题、收集文体印章，在故事里拓宽阅读边界。">
<meta property="og:type" content="website">
<link href="./fonts/fonts.css" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0a;
  --bg-2: #131313;
  --bg-3: #1c1a18;
  --fg: #f0ede8;
  --fg-2: #a8a39c;
  --fg-3: #6b6660;
  --accent: #c4453b;
  --accent-glow: rgba(196, 69, 59, 0.45);
  --accent-2: #8a3027;
  --border: #2a2825;
  --border-2: #3a3633;

  --font-serif: 'Noto Serif SC', 'Songti SC', 'STSong', 'SimSun', 'NSimSun', serif;
  --font-mono: 'JetBrains Mono', 'SF Mono', 'Menlo', 'Consolas', monospace;

  --r: 4px;
  --r-card: 8px;
  --r-full: 999px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-serif);
  font-size: 18px;
  line-height: 1.85;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  letter-spacing: 0.02em;
}

body { display: flex; flex-direction: column; }

/* === 顶部导航 === */
#topbar {
  display: none;
  position: sticky;
  top: 0;
  background: rgba(10, 10, 10, 0.92);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 14px 32px;
  z-index: 50;
}
#topbar.visible { display: flex; align-items: center; justify-content: space-between; }
#topbar .nav-left, #topbar .nav-right { display: flex; align-items: center; gap: 18px; }
#topbar .brand { font-family: var(--font-serif); font-size: 13px; letter-spacing: 0.3em; color: var(--fg-2); }
#topbar .user-chip { display: flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 12px; color: var(--fg-2); letter-spacing: 0.1em; }
#topbar .user-dot { width: 6px; height: 6px; background: var(--accent); border-radius: var(--r-full); box-shadow: 0 0 6px var(--accent-glow); }
#topbar .icon-btn { background: none; border: none; color: var(--fg-2); cursor: pointer; padding: 6px; display: flex; align-items: center; justify-content: center; border-radius: var(--r); transition: color .15s; }
#topbar .icon-btn:hover { color: var(--accent); }
#topbar .icon-btn.active { color: var(--accent); }
#topbar .icon-btn svg { width: 18px; height: 18px; stroke-linecap: round; stroke-linejoin: round; }

/* === 视图通用 === */
.view { display: none; min-height: 100vh; padding: 48px 32px; }
.view.active { display: block; }

/* === 启动屏 === */
#view-launch {
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 64px 32px;
}
#view-launch.active { display: flex; }
.launch-title {
  font-family: var(--font-serif);
  font-weight: 700;
  font-size: 56px;
  letter-spacing: 0.18em;
  color: var(--fg);
  margin-bottom: 12px;
}
.launch-sub {
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: 0.5em;
  color: var(--accent);
  text-transform: uppercase;
  margin-bottom: 80px;
}
.launch-label {
  font-family: var(--font-serif);
  font-size: 13px;
  letter-spacing: 0.6em;
  color: var(--fg-3);
  margin-bottom: 32px;
  padding-left: 0.6em;
}
.launch-note {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.35em;
  color: var(--fg-3);
  margin-top: 56px;
  text-align: center;
  padding-left: 0.35em;
}
.users-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 16px;
  max-width: 640px;
  width: 100%;
}
.user-slot {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: var(--r-card);
  padding: 28px 16px 22px;
  text-align: center;
  cursor: pointer;
  transition: all .18s;
}
.user-slot:hover { border-color: var(--accent); background: var(--bg-3); transform: translateY(-2px); }
.user-slot .avatar {
  width: 56px; height: 56px;
  margin: 0 auto 14px;
  border-radius: var(--r-full);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-serif);
  font-weight: 700;
  font-size: 22px;
  color: var(--fg);
  border: 1px solid var(--border-2);
}
.user-slot .name {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--fg-2);
  letter-spacing: 0.15em;
}
.user-slot.add .avatar { background: transparent; color: var(--fg-3); font-size: 28px; font-weight: 400; }
.user-slot.add:hover .avatar { color: var(--accent); }

/* === 探索地图 === */
#view-map { padding: 48px 32px 96px; }
.map-header {
  max-width: 960px;
  margin: 0 auto 32px;
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--border);
}
.map-header h2 { font-family: var(--font-serif); font-weight: 700; font-size: 26px; letter-spacing: 0.2em; }
.map-progress { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); letter-spacing: 0.25em; }
.map-progress strong { color: var(--accent); font-weight: 500; font-size: 14px; }

.star-map {
  max-width: 960px;
  margin: 0 auto;
  position: relative;
  aspect-ratio: 16 / 10;
  background:
    radial-gradient(circle at 20% 30%, rgba(196,69,59,0.05), transparent 50%),
    radial-gradient(circle at 80% 70%, rgba(196,69,59,0.04), transparent 55%),
    var(--bg-2);
  border: 1px solid var(--border);
  border-radius: var(--r-card);
}
.star-map svg { width: 100%; height: 100%; display: block; }
.star-node circle.outer { fill: none; stroke: var(--border-2); stroke-width: 1.2; transition: all .2s; }
.star-node circle.inner { fill: var(--bg-3); stroke: var(--border-2); stroke-width: 1; transition: all .2s; }
.star-node text.region-name {
  font-family: var(--font-serif);
  font-size: 15px;
  font-weight: 500;
  fill: var(--fg-2);
  text-anchor: middle;
  letter-spacing: 0.2em;
}
.star-node text.region-count {
  font-family: var(--font-mono);
  font-size: 10px;
  fill: var(--fg-3);
  text-anchor: middle;
  letter-spacing: 0.15em;
}
.star-node { cursor: pointer; }
.star-node:hover circle.outer { stroke: var(--accent); }
.star-node.lit circle.outer { stroke: var(--accent); filter: drop-shadow(0 0 8px var(--accent-glow)); }
.star-node.lit circle.inner { fill: var(--accent); stroke: var(--accent); }
.star-node.lit text.region-name { fill: var(--fg); }

.map-legend {
  max-width: 960px;
  margin: 24px auto 0;
  display: flex;
  gap: 28px;
  flex-wrap: wrap;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--fg-3);
  letter-spacing: 0.18em;
}
.map-legend span { display: inline-flex; align-items: center; gap: 8px; }
.map-legend .dot { width: 7px; height: 7px; border-radius: var(--r-full); }
.map-legend .dot.unlit { background: var(--border-2); }
.map-legend .dot.lit { background: var(--accent); box-shadow: 0 0 6px var(--accent-glow); }

.region-panel { max-width: 960px; margin: 40px auto 0; display: none; }
.region-panel.open { display: block; animation: fadeUp .35s ease-out; }
.region-panel h3 {
  font-family: var(--font-serif);
  font-weight: 500;
  font-size: 16px;
  color: var(--fg-2);
  letter-spacing: 0.25em;
  margin-bottom: 16px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
}
.article-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 18px 4px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: padding .15s, background .15s;
}
.article-row:hover { padding-left: 14px; padding-right: 14px; background: var(--bg-2); }
.article-row .meta { flex: 1; }
.article-row .title { font-family: var(--font-serif); font-size: 17px; color: var(--fg); margin-bottom: 4px; }
.article-row .form { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); letter-spacing: 0.25em; }
.article-row .word-count { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); letter-spacing: 0.15em; }
.article-row.read .title { color: var(--fg-2); }
.article-row.read .title::after { content: ' · 已读'; color: var(--accent); font-size: 12px; font-family: var(--font-mono); letter-spacing: 0.15em; }

/* === 文章详情 === */
#view-article { padding: 48px 32px 96px; }
.article-container { max-width: 680px; margin: 0 auto; }
.article-meta {
  display: flex;
  gap: 18px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--fg-3);
  letter-spacing: 0.2em;
  margin-bottom: 24px;
}
.article-meta .form { color: var(--accent); }
.article-title {
  font-family: var(--font-serif);
  font-weight: 700;
  font-size: 36px;
  letter-spacing: 0.12em;
  margin-bottom: 40px;
  padding-bottom: 24px;
  border-bottom: 1px solid var(--border);
}
.article-body {
  font-family: var(--font-serif);
  font-size: 17px;
  line-height: 2;
  color: var(--fg);
  letter-spacing: 0.04em;
}
.article-body p { margin-bottom: 1.3em; }

.article-actions {
  margin: 56px 0 40px;
  padding-top: 32px;
  border-top: 1px solid var(--border);
  text-align: center;
}
.btn-light {
  background: transparent;
  border: 1px solid var(--accent);
  color: var(--accent);
  font-family: var(--font-serif);
  font-size: 13px;
  letter-spacing: 0.35em;
  padding: 13px 32px;
  cursor: pointer;
  border-radius: var(--r);
  transition: all .15s;
  padding-left: calc(32px + 0.35em);
}
.btn-light:hover { background: var(--accent); color: var(--fg); }
.btn-light.lit { background: var(--accent); color: var(--fg); cursor: default; opacity: 0.7; }

.related { margin-top: 40px; padding-top: 32px; border-top: 1px solid var(--border); }
.related-label {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--fg-3);
  letter-spacing: 0.4em;
  margin-bottom: 16px;
  text-align: center;
}
.related-list { display: flex; flex-direction: column; gap: 1px; background: var(--border); }
.related-item {
  background: var(--bg);
  padding: 16px 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: pointer;
  transition: background .15s, padding .15s;
}
.related-item:hover { background: var(--bg-2); padding-left: 24px; }
.related-item .title { font-family: var(--font-serif); font-size: 15px; color: var(--fg); margin-bottom: 2px; }
.related-item .form { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); letter-spacing: 0.25em; }
.related-item .arrow { color: var(--fg-3); font-family: var(--font-mono); font-size: 14px; }
.related-item:hover .arrow { color: var(--accent); }

/* === 探索榜 === */
#view-ranking { padding: 48px 32px; }
.ranking-container { max-width: 720px; margin: 0 auto; }
.page-title {
  font-family: var(--font-serif);
  font-weight: 700;
  font-size: 26px;
  letter-spacing: 0.22em;
  margin-bottom: 8px;
}
.page-sub {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--fg-3);
  letter-spacing: 0.25em;
  margin-bottom: 40px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--border);
}
.rank-row {
  display: grid;
  grid-template-columns: 40px 1fr auto auto;
  align-items: center;
  gap: 20px;
  padding: 18px 4px;
  border-bottom: 1px solid var(--border);
}
.rank-row .num { font-family: var(--font-mono); font-size: 13px; color: var(--fg-3); letter-spacing: 0.1em; }
.rank-row.top .num { color: var(--accent); font-size: 17px; font-weight: 500; }
.rank-row .name { font-family: var(--font-serif); font-size: 17px; color: var(--fg); }
.rank-row.top .name { color: var(--accent); }
.rank-row .stats { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); letter-spacing: 0.18em; }
.rank-row .stats strong { color: var(--fg); font-weight: 500; }
.rank-row.me {
  background: linear-gradient(90deg, rgba(196,69,59,0.07), transparent 70%);
  padding-left: 14px;
  padding-right: 14px;
  margin-left: -14px;
  margin-right: -14px;
  border-radius: var(--r);
}

/* === 护照 === */
#view-passport { padding: 48px 32px; }
.passport-container { max-width: 720px; margin: 0 auto; }
.stamp-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 1px;
  background: var(--border);
  border: 1px solid var(--border);
  margin-bottom: 40px;
}
.stamp { background: var(--bg); padding: 32px 16px; text-align: center; transition: background .2s; }
.stamp .seal {
  width: 64px; height: 64px;
  margin: 0 auto 14px;
  border: 1.5px solid var(--border-2);
  border-radius: var(--r-full);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-serif);
  font-weight: 700;
  font-size: 22px;
  color: var(--fg-3);
  transition: all .2s;
}
.stamp.collected { background: rgba(196,69,59,0.04); }
.stamp.collected .seal {
  border-color: var(--accent);
  color: var(--accent);
  background: rgba(196,69,59,0.08);
  box-shadow: 0 0 12px rgba(196,69,59,0.2);
}
.stamp .form-name { font-family: var(--font-serif); font-size: 13px; color: var(--fg-2); letter-spacing: 0.25em; margin-bottom: 4px; }
.stamp .count { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); letter-spacing: 0.15em; }
.stamp.collected .count { color: var(--accent); }

.passport-list { display: flex; flex-direction: column; gap: 1px; background: var(--border); }
.passport-row {
  background: var(--bg);
  padding: 14px 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.passport-row .label { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); letter-spacing: 0.25em; }
.passport-row .value { font-family: var(--font-serif); font-size: 15px; color: var(--fg); margin-bottom: 2px; }
.passport-row.empty { justify-content: center; color: var(--fg-3); font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.3em; padding: 32px; }

/* === 添加用户模态 === */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(10,10,10,0.88);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
}
.modal-overlay.open { display: flex; animation: fadeIn .2s; }
.modal {
  background: var(--bg-2);
  border: 1px solid var(--border-2);
  border-radius: var(--r-card);
  padding: 36px 28px;
  max-width: 340px;
  width: calc(100% - 48px);
}
.modal h3 {
  font-family: var(--font-serif);
  font-weight: 700;
  font-size: 18px;
  letter-spacing: 0.2em;
  margin-bottom: 20px;
  color: var(--fg);
}
.modal input {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--fg);
  font-family: var(--font-mono);
  font-size: 14px;
  padding: 11px 14px;
  margin-bottom: 18px;
  border-radius: var(--r);
  outline: none;
  letter-spacing: 0.1em;
  transition: border-color .15s;
}
.modal input:focus { border-color: var(--accent); }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
.modal-btn {
  background: transparent;
  border: 1px solid var(--border-2);
  color: var(--fg-2);
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.2em;
  padding: 10px 18px;
  cursor: pointer;
  border-radius: var(--r);
  transition: all .15s;
}
.modal-btn:hover { color: var(--fg); border-color: var(--fg-3); }
.modal-btn.primary { background: var(--accent); border-color: var(--accent); color: var(--fg); }
.modal-btn.primary:hover { background: var(--accent-2); border-color: var(--accent-2); }

/* === 响应式 === */
@media (max-width: 640px) {
  html, body { font-size: 16px; }
  .view { padding: 32px 18px; }
  #topbar { padding: 12px 18px; gap: 8px; }
  #topbar .nav-left, #topbar .nav-right { gap: 10px; }
  #topbar .brand { display: none; }
  .launch-title { font-size: 38px; }
  .launch-sub { margin-bottom: 56px; }
  .article-title { font-size: 26px; }
  .article-body { font-size: 16px; line-height: 1.9; }
  .map-header h2 { font-size: 20px; }
  .stamp-grid { grid-template-columns: repeat(2, 1fr); }
  .rank-row { grid-template-columns: 28px 1fr auto; gap: 12px; padding: 14px 4px; }
  .rank-row .stats { font-size: 10px; }
  .rank-row .name { font-size: 15px; }
  .page-title { font-size: 22px; }
}

/* === 动效 === */
@keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.view.active > * { animation: fadeUp .45s ease-out both; }
.view.active > *:nth-child(2) { animation-delay: .06s; }
.view.active > *:nth-child(3) { animation-delay: .12s; }
.view.active > *:nth-child(4) { animation-delay: .18s; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<!-- 顶部导航 -->
<nav id="topbar">
  <div class="nav-left">
    <button class="icon-btn" id="btn-home" title="返回首页">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 12L12 4l9 8M5 10v10h14V10"></path></svg>
    </button>
    <span class="brand">阅 读 探 险</span>
  </div>
  <div class="nav-right">
    <span class="user-chip"><span class="user-dot"></span><span id="current-user-name">—</span></span>
    <button class="icon-btn" id="btn-map" title="探索地图">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3v18"></path></svg>
    </button>
    <button class="icon-btn" id="btn-ranking" title="探索榜">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 20V11M10 20V4M16 20V14M22 20H2"></path></svg>
    </button>
    <button class="icon-btn" id="btn-passport" title="护照">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 3h10l3 3v15H6z"></path><path d="M9 9h7M9 13h7M9 17h4"></path></svg>
    </button>
  </div>
</nav>

<!-- 视图1：启动屏 -->
<section id="view-launch" class="view active">
  <h1 class="launch-title">阅读探险</h1>
  <div class="launch-sub">Reading · Quest</div>
  <div class="launch-label">选 择 旅 人</div>
  <div class="users-grid" id="users-grid"><div class="user-slot add"><div class="avatar">+</div><div class="name">新旅人</div></div></div>
  <div class="launch-note">无 需 注 册 · 进 度 自 动 保 存 在 本 设 备</div>
</section>

<!-- 视图2：探索地图 -->
<section id="view-map" class="view">
  <div class="map-header">
    <h2>探 险 之 图</h2>
    <div class="map-progress">已 点 亮 <strong id="lit-count">0</strong> / <span id="lit-total"></span></div>
  </div>
  <div class="star-map">
    <svg id="star-svg" viewBox="0 0 720 450" preserveAspectRatio="xMidYMid meet"></svg>
  </div>
  <div class="map-legend">
    <span><span class="dot unlit"></span>未点亮</span>
    <span><span class="dot lit"></span>已点亮</span>
    <span>点 击 节 点 查 看 文 章</span>
  </div>
  <div class="region-panel" id="region-panel">
    <h3 id="region-title"></h3>
    <div id="region-articles"></div>
  </div>
</section>

<!-- 视图3：文章详情 -->
<section id="view-article" class="view">

郦道元（约470—527），北魏人，《水经注》是他给古书《水经》做的注——注得比原书大几十倍，成了一部地理巨著。

李白这首《蜀道难》大约写于唐玄宗天宝初年，是一首"送别加劝阻"的诗。表面写蜀地山路的险峻，实际是劝友人不要去蜀地任职——那地方太险，政治上也乱。剑阁一道关，一人把守，万人难开，历来是割据者的窝。

    id: 'a7', title: '北海牧羊', form: '历史', theme: 'solitude', wordCount: 703,
    content: `律知武终不可胁，白单于。单于愈益欲降之，乃幽武置大窖中，绝不饮食。天雨雪，武卧啮雪，与旃毛并咽之，数日不死。匈奴以为神，乃徙武北海上无人处，使牧羝，羝乳乃得归。别其官属常惠等，各置他所。

武既至海上，廪食不至，掘野鼠、去草实而食之。杖汉节牧羊，卧起操持，节旄尽落。积五六年，单于弟於靬王弋射海上。武能网纺缴，檠弓弩，於靬王爱之，给其衣食。三岁余，王病，赐武马畜、服匿、穹庐。王死后，人众徙去。其冬，丁令盗武牛羊，武复穷厄。

——《汉书·苏武传》

【注释】
胁：胁迫，这里指迫使投降。
幽：囚禁。
雨雪：下雪。雨，作动词，落下。
啮：咬、嚼。
旃：同"毡"，毛毡。
羝：公羊。乳：生子。公羊产奶生子，当然永无可能。
廪食：官府供应的粮食。
去：同"弆"，收藏。掘野鼠洞，取鼠收藏的草籽。
弋射：用带绳的箭射猎。
檠：矫正弓弩的工具，这里作动词，用檠校正。
穹庐：毡帐。穷厄：穷困。

【导读】
班固写苏武，比谁都舍得给细节：关进地窖，就嚼雪吞毡毛；断粮了，就去掏老鼠洞里的存粮。孤独不是形容词，是一口一口咽下去的东西。

全段最狠的是八个字："杖汉节牧羊，卧起操持，节旄尽落。"十九年，就写一根棍子——出门带着，睡觉抱着，上头的牦牛尾毛一根根掉光。人不降，棍子也不降。

北海无人处，连个说汉话的人都没有。单于要的就是把他从人间抹掉：给你一群公羊，等公羊下崽吧。可苏武硬是把自己活成了一根钉子，钉在贝加尔湖边，钉到匈奴人先没了办法。

顺便说一句文体。《史记》写人靠一声叹、一个眼神，扑面而来；《汉书》写人靠一件一件具体的事：啮雪、掏鼠洞、修弓弩，你自己看完，心里那声叹是它替你攒出来的。苏武这一节，是《汉书》笔法的顶配。

孤独不是没人陪，是没人看见你还守着——他还守。`,

    id: 'a8', title: '雁荡山', form: '科普', theme: 'solitude', wordCount: 703,
    content: `温州雁荡山，天下奇秀，然自古图牒，未尝有言者。祥符中，因造玉清宫，伐山取材，方有人见之，此时尚未有名。按西域书，阿罗汉诺矩罗居震旦东南大海际雁荡山芙蓉峰龙湫。唐僧贯休为《诺矩罗赞》，有"雁荡经行云漠漠，龙湫宴坐雨蒙蒙"之句。此山南有芙蓉峰，峰下芙蓉驿，前瞰大海，然未知雁荡、龙湫所在，后因伐木，始见此山。山顶有大池，相传以为雁荡；下有二潭水，以为龙湫。

予观雁荡诸峰，皆峭拔险怪，上耸千尺，穹崖巨谷，不类他山，皆包在诸谷中，自岭外望之，都无所见；至谷中则森然干霄。原其理，当是为谷中大水冲激，沙土尽去，唯巨石岿然挺立耳。

——《梦溪笔谈·雁荡山》

【注释】
图牒：地图和书籍记载。
祥符：宋真宗年号大中祥符（1008—1016）。
西域书：指佛经。
震旦：古代印度对中国的称呼。
宴坐：静坐，坐禅。
瞰：俯视。
干霄：直冲云霄。
原：推究，考察。
岿然：高大挺立的样子。

【导读】
沈括（1031—1095），北宋人，《梦溪笔谈》被李约瑟称作中国科学史上的坐标。这一条记雁荡山，两句话值得盯住。

第一句："自古图牒，未尝有言者。"一座天下奇秀的山，古书上竟没人写过——因为它"皆包在诸谷中"，岭外望进去什么都看不见。一座山，把自己藏了上千年，直到砍树造宫殿才被人撞见。孤独不是山没有风景，是风景没人知道。

第二句："为谷中大水冲激，沙土尽去。"沈括看懂了这些奇峰是流水切出来的。欧洲人到十八世纪才讲清流水侵蚀的道理，他早了六百年。

注意"原其理"这三个字。别人看山是看景，他看山要追问成因，先观察，再推断，最后落到"唯巨石岿然挺立耳"——一句把机理说透。这是科学家的本能，也是《梦溪笔谈》五百多条笔记共同的脾气——凡事先问一个为什么。

山藏得深，眼光也藏得深。两样的孤独，撞在这一条短短的山志笔记里。`,

    id: 'a9', title: '江雪', form: '诗歌', theme: 'solitude', wordCount: 704,
    content: `千山鸟飞绝，
万径人踪灭。
孤舟蓑笠翁，
独钓寒江雪。

—— 柳宗元

【解读】
柳宗元写这首诗的时候，正在被贬永州。公元805年，他参与的"永贞革新"失败：皇帝病退，靠山倒台，同伙被杀的被杀、流放的流放。他从朝廷里最有前途的年轻官员，一路贬到南方荒僻之地，挂个"司马"的空衔——没有实权，不许干政，实际上是被看管起来。这一待就是十年。母亲死在永州，他自己落下一身病。

所以这不是一首风景诗。

高手写情绪，从不报名字，只摆证据。整首诗写的全是"没有"：没有鸟，没有人，没有路可走。可柳宗元偏不直说"我孤独"，他给你一个画面，让你自己看。你看出来了，那孤独就是你的了。

你注意他的镜头怎么推。第一句起得极大：千山、万径——空间拉到无穷大。然后写"绝"、写"灭"——把活的东西全部拿走，鸟没有了，人没有了。镜头继续推近：万山之中，只剩一条船；船上，只剩一个人。天底下干干净净，最后落在"独钓"两个字上。四句诗，是一个从天地推到孤舟的长镜头。

钓？寒江封冻，钓不上鱼的。老翁钓的不是鱼，是"我还在这儿"。全世界都不理你了，官没了，朋友散了，天地白茫茫一片——他还是披着蓑衣坐在那里。风骨就在这个"坐"里：不喊冤，不求饶，也不走。

还有一个藏了一千多年的机关：把四句每行的第一个字连起来读——千、万、孤、独。"千万孤独"。是巧合还是有意，没人能断定。但放在这首诗里，准得吓人。二十个字，藏头藏尾，处处是心眼。

柳宗元在永州写山水出了名，《永州八记》里的石头、溪水、小潭，篇篇都是好文章。可你细看，那些山水全都像《江雪》里的老翁——被丢在荒僻处，没人来看，自己长成了风景。

四句二十个字，是一个丢了所有的人，给自己画的像。李白写孤独靠喊，"古来圣贤皆寂寞"；柳宗元不喊，他把孤独冻在雪里，冻得更久。`,

    id: 'a10', title: '五柳先生', form: '传记', theme: 'solitude', wordCount: 738,
    content: `先生不知何许人也，亦不详其姓字，宅边有五柳树，因以为号焉。闲静少言，不慕荣利。好读书，不求甚解；每有会意，便欣然忘食。性嗜酒，家贫不能常得。亲旧知其如此，或置酒而招之；造饮辄尽，期在必醉。既醉而退，曾不吝情去留。环堵萧然，不蔽风日；短褐穿结，箪瓢屡空，晏如也。常著文章自娱，颇示己志。忘怀得失，以此自终。

赞曰：黔娄之妻有言："不戚戚于贫贱，不汲汲于富贵。"其言兹若人之俦乎？衔觞赋诗，以乐其志，无怀氏之民欤？葛天氏之民欤？

——陶渊明《五柳先生传》

【注释】
何许：何处，什么地方。
不详：不清楚，不知道。
不求甚解：不死抠字眼，指读书重在领会大意。
会意：对书中意旨有所领会。
造：到、往。辄：就。
曾不吝情去留：竟不挂心于去留，指喝完就走，毫不拘礼。
环堵：四面墙壁。萧然：空空荡荡的样子。
短褐：粗布短衣。穿结：打着补丁。
箪瓢屡空：饭篮水瓢常常空着。晏如：安然自在。
戚戚：忧愁的样子。汲汲：急切钻营的样子。
俦：同类。无怀氏、葛天氏：传说中上古的太平帝王。

【导读】
这篇小传只有两百来字，是陶渊明给自己画的像——门前五棵柳树，就拿"五柳先生"当号，真名反而不提。一开头，就把"你是谁"这个人人急着回答的问题，轻轻放下了。

孤独在这篇里不是苦，是挑的。"闲静少言，不慕荣利"；读书不为功名，读到会心处高兴得忘了吃饭；家徒四壁，饭瓢常空，他"晏如也"——安之若素。这不是没本事出去混，是看明白了不想混。后来陶渊明真辞了彭泽县令，不肯为五斗米折腰，回家种地去了。小传里那个人，和他后来过的日子，是一个人。

"好读书，不求甚解"六个字，可以留给今天做个对照：读的是意思，不是字句；求的是会意，不是打卡。

结尾他把自己挂到无怀氏、葛天氏的治下——传说中上古的太平时代。现实里找不到同类，就到传说里去找。这是陶渊明的孤独，也是他的自由。`,

    id: 'a11', title: '在烈日和暴雨下', form: '小说节选', theme: 'courage', wordCount: 808,
    content: `六月十五那天，天热得发了狂。太阳刚一出来，地上已经像下了火。一些似云非云似雾非雾的灰气低低地浮在空中，使人觉得憋气。一点风也没有。祥子在院子里看了看那灰红的天，喝了瓢凉水就走出去。

街上的柳树像病了似的，叶子挂着层灰土在枝上打着卷；枝条一动也懒得动，无精打采地低垂着。马路上一个水点也没有，干巴巴地发着白光。便道上尘土飞起多高，跟天上的灰气联接起来，结成一片毒恶的灰沙阵，烫着行人的脸。处处干燥，处处烫手，处处憋闷，整个的老城像烧透了的砖窑，使人喘不过气来。狗趴在地上吐出红舌头，骡马的鼻孔张得特别大，小贩们不敢吆喝，柏油路晒化了，甚至于铺户门前的铜牌好像也要晒化。街上非常寂静，只有铜铁铺里发出使人焦躁的一些单调的丁丁当当。

拉车的人们，只要今天还不至于挨饿，就懒得去张罗买卖：有的把车放在有些阴凉的地方，支起车棚，坐在车上打盹；有的钻进小茶馆去喝茶；有的根本没拉出车来，只到街上看看有没有出车的可能。每一口井都成了他们的救星，不管刚拉了几步，见井就奔过去；赶不上新汲的水，就跟骡马同在水槽里灌一大气。还有的，因为中了暑，或是发痧，走着走着，一头栽到地上，永不起来。

——老舍《骆驼祥子》第十八章

【注释】
吆喝：大声叫卖。
张罗：筹划、料理，这里指招揽生意。
新汲：刚从井里打上来的（水）。
发痧：中暑的一种，民间称"发痧"。

【导读】
老舍（1899—1966），《骆驼祥子》1936年出版，这一章是全书最著名的段落，讲人力车夫祥子在毒日头下拉车的一天。

你注意老舍怎么写热：他几乎不直接写"热"字，写的是狗吐舌头、骡马张大鼻孔、铜牌像要晒化、柏油路软了。一座老城被他写成"烧透了的砖窑"——人在窑里，就是窑里的砖。

别的车夫可以歇，"只要今天还不至于挨饿"。祥子不敢歇，歇了今天就没了嚼谷。他的勇气没有观众，没有呐喊，就是喝一瓢凉水，拉开车门，走进火里。

这不是英雄式的勇敢，是穷人的勇敢——被日子逼到墙角，还得往前迈步。后来暴雨浇下来，祥子病了一场。可第二天，他还得出去。`,

    id: 'a12', title: '班超夜袭', form: '历史', theme: 'courage', wordCount: 784,
    content: `超到鄯善，鄯善王广奉超礼敬甚备，后忽更疏懈。超谓其官属曰："宁觉广礼意薄乎？此必有北虏使来，狐疑未知所从故也。明者睹未萌，况已著邪？"乃召侍胡诈之曰："匈奴使来数日，今安在乎？"侍胡惶恐，具服其状。超乃闭侍胡，悉会其吏士三十六人，与共饮，酒酣，因激怒之曰："卿曹与我俱在绝域，欲立大功，以求富贵。今虏使到裁数日，而王广礼敬即废；如令鄯善收吾属送匈奴，骸骨长为豺狼食矣。为之奈何？"官属皆曰："今在危亡之地，死生从司马。"超曰："不入虎穴，不得虎子。当今之计，独有因夜以火攻虏，使彼不知我多少，必大震怖，可殄尽也。灭此虏，则鄯善破胆，功成事立矣。"众曰："当与从事议之。"超怒曰："吉凶决于今日。从事文俗吏，闻此必恐而谋泄，死无所名，非壮士也！"众曰："善。"

初夜，遂将吏士往奔虏营。会天大风，超令十人持鼓藏虏舍后，约曰："见火然，皆当鸣鼓大呼。"余人悉持兵弩夹门而伏。超乃顺风纵火，前后鼓噪。虏众惊乱，超手格杀三人，吏兵斩其使及从士三十余级，余众百许人悉烧死。

——《后汉书·班超传》

【注释】
疏懈：疏远怠慢。
宁：难道。
著：明显，显露。
侍胡：服侍汉使的胡人。
卿曹：你们这些人。曹，辈。
裁：同"才"。
绝域：极远的地方。
殄：消灭。
文俗吏：安于文墨的平庸官吏。
然：同"燃"。
格杀：击杀。
许：左右，表约数。

【导读】
范晔《后汉书》，"不入虎穴，不得虎子"就打这儿来的。

三十六个人，对一百多人的匈奴使团，硬拼是送死。班超怎么赢的？把这段拆开看，全是细活：先是鄯善王礼数一冷，他就断定匈奴使者到了——从脸色里读情报；再诈唬侍胡，一句"今安在乎"套出虚实；动手前瞒住随行的文官，怕走漏风声；挑了大风的初夜，顺风放火，鼓声喊声一块上，让敌人摸不清人数。

勇气不是鲁莽的近亲，是精密计算的最后一跳。该算的账全算完，班超才说那句狠话。话狠，手更狠——"超手格杀三人"，他第一个动手。

两千年过去，人们记住的是虎穴那八个字。别忘了，虎穴是他先摸清楚才敢进的。`,

    id: 'a13', title: '活板', form: '科普', theme: 'courage', wordCount: 712,
    content: `庆历中，有布衣毕昇，又为活板。其法：用胶泥刻字，薄如钱唇，每字为一印，火烧令坚。先设一铁板，其上以松脂、蜡和纸灰之类冒之。欲印，则以一铁范置铁板上，乃密布字印，满铁范为一板，持就火炀之；药稍熔，则以一平板按其面，则字平如砥。若止印三二本，未为简易；若印数十百千本，则极为神速。常作二铁板，一板印刷，一板已自布字，此印者才毕，则第二板已具，更互用之，瞬息可就。每一字皆有数印，如"之""也"等字，每字有二十余印，以备一板内有重复者。不用，则以纸帖之，每韵为一帖，木格贮之。有奇字素无备者，旋刻之，以草火烧，瞬息可成。不以木为之者，木理有疏密，沾水则高下不平，兼与药相粘，不可取；不若燔土，用讫再火令药熔，以手拂之，其印自落，殊不沾污。

昇死，其印为予群从所得，至今保藏。

——《梦溪笔谈·活板》

【注释】
布衣：平民。古代平民穿布衣，故以布衣代指无官职者。
钱唇：铜钱的边缘。
冒：覆盖。
范：框子。
炀：烘烤。
砥：磨刀石，形容字模极平。
更互：交替，轮流。
帖：用标签标出。
韵：韵部，古代按字音分类。
奇字：生僻字。
燔：烧。

【导读】

    content: `生当作人杰，

【解读】
二十个字，四句话，没有一个生僻字。可这首诗的分量，压住了一部宋史。

绝句是诗里最短的体裁，二十个字，容不得铺垫，容不得客套，第一句就得出骨头。长诗可以绕，绝句没地方躲。李清照偏偏选了它来骂一个时代。

背景先说清。李清照写它的时候，北宋刚亡。1127年，金兵攻破开封，徽钦二帝被掳走，朝廷仓皇南渡，偏安杭州。她自己的丈夫赵明诚做江宁知府，城里有人叛乱，他半夜从城墙上吊绳子跑了——弃城而逃。第二年，赵明诚病死在赴任路上。国破了，家也跟着散了。李清照后半生抱着残存的金石书画一路南逃，东西丢的丢、抢的抢，最后所剩无几。

她是个女人，那个年代女人不能做官，不能领兵。她能做的，是写下这二十个字。

项羽的故事：垓下战败，只剩二十八骑。乌江亭长备了船劝他过江——江东子弟还在，地方千里，人可以再起。项羽笑了：我带八千江东子弟出来，如今一个没剩。就算江东父老可怜我，还肯认我做王，我有什么脸面见他们？他把马送给亭长，步行接战，杀了几百人，自刎而死。死时三十一岁。

"不肯过江东"——她夸的是项羽，骂的是所有过江逃命的人。朝廷过江了，丈夫也"过江"了。连她自己，也被人潮裹挟着过了江。所以这四句里没有一句是站着说话不腰疼的，每一句都烫。

再看她的写法。前两句是标准：生，要当人中豪杰；死，也要做鬼里英雄。后两句是证据：我为什么提项羽？因为到今天我还想着他，想着他那一回头。不喊口号，不点名骂谁，只立一个标准在那里。然后回头一看，满朝文武，够不上这个标准。

李清照是婉约词的代表，写"寻寻觅觅，冷冷清清"的那个李清照。可到了该硬的时候，她的骨头比谁都硬。二十个字，是乱世里一个读书人拿得出的全部兵器。`,

    id: 'a18', title: '石油', form: '科普', theme: 'secret', wordCount: 700,
    content: `鄜、延境内有石油，旧说"高奴县出脂水"，即此也。生于水际，沙石与泉水相杂，惘惘而出，土人以雉尾挹之，乃采入缶中。颇似淳漆，然之如麻，但烟甚浓，所幄幕皆黑。余疑其烟可用，试扫其煤以为墨，黑光如漆，松墨不及也，遂大为之。其识文为"延川石液"者是也。此物后必大行于世，自余始为之。盖石油至多，生于地中无穷，不若松木有时而竭。今齐、鲁间松林尽矣，渐至太行、京西、江南，松山大半皆童矣。造煤人盖未知石烟之利也。

    content: `相见时难别亦难，

青鸟殷勤为探看。

—— 李商隐

【解读】
李商隐是唐代最会藏秘密的诗人。他一辈子夹在牛党、李党之间：恩师令狐楚是牛党，岳父王茂元却被划进李党。娶了妻子，等于背叛了师门。两头都不容他，官越做越小，心事没法明说，只好写"无题"——连题目都不给。这样的无题诗，他留下来十几首，一首比一首难猜。有人猜爱情，有人猜仕途，猜了一千年。

这首诗表面上写的是一场秘密的爱情：见面难，分别更难。开头两个"难"字叠在一起，前一个难是机会难得，后一个难是割舍不下。"东风无力百花残"——不是花该谢，是东风没力气护住花了。写景七个字，把"留不住"三个字说尽。

最狠的是中间一联。"春蚕到死丝方尽"——"丝"和"思"同音，蚕吐丝到死才停，人的思念到死才断。"蜡炬成灰泪始干"——蜡烛烧成灰，"泪"才流干。两个比喻都不新鲜，新鲜的是那股劲：不说想念有多深，只说想念的期限——到死，成灰。这两句从情诗里长出来，后来变成形容一切至死不渝的句子，从爱情用到事业，用到一切认死理的人。

后半转换视角：清晨照镜子，怕你愁得鬓角变白；夜里吟诗，月光该冷了吧——不说自己苦，全在猜对方苦。最后两句给自己留一条缝：蓬山此去无多路，青鸟殷勤为探看。蓬山是仙山，青鸟是王母娘娘的信使。路其实不远，就是过不去，只好托一只鸟，一趟一趟地探。

秘密的爱情也好，秘密的志向也好，写法是一样的：不直说。用蚕丝说，用烛泪说，用清晨镜子里的白发说。

    content: `家有老妪，尝居于此。妪，先大母婢也，乳二世，先妣抚之甚厚。室西连于中闺，先妣尝一至。妪每谓余曰："某所，而母立于兹。"妪又曰："汝姊在吾怀，呱呱而泣；娘以指叩门扉曰：'儿寒乎？欲食乎？'吾从板外相为应答。"语未毕，余泣，妪亦泣。

余自束发读书轩中，一日，大母过余曰："吾儿，久不见若影，何竟日默默在此，大类女郎也？"比去，以手阖门，自语曰："吾家读书久不效，儿之成，则可待乎！"顷之，持一象笏至，曰："此吾祖太常公宣德间执此以朝，他日汝当用之！"瞻顾遗迹，如在昨日，令人长号不自禁。

余既为此志，后五年，吾妻来归，时至轩中，从余问古事，或凭几学书。吾妻归宁，述诸小妹语曰："闻姊家有阁子，且何谓阁子也？"其后六年，吾妻死，室坏不修。其后二年，余久卧病无聊，乃使人复葺南阁子，其制稍异于前。然自后余多在外，不常居。

庭有枇杷树，吾妻死之年所手植也，今已亭亭如盖矣。

——归有光《项脊轩志》

【注释】
先大母：已故的祖母。
乳二世：喂养过两代人。乳，作动词，哺乳。
先妣：已故的母亲。
而：同"尔"，你。
束发：古代男孩十五岁束发，代指少年。
过：看望。
阖：关闭。
象笏：象牙做的朝笏，官员上朝时所执的手板。
来归：嫁到我家来。归，女子出嫁。
归宁：出嫁女子回娘家省亲。
葺：修补。
亭亭如盖：高高挺立，树冠像伞盖一样。

【导读】
归有光（1507—1571），明代散文家。他八岁丧母，对母亲的印象几乎没有，文中那点记忆，全靠家里的老佣人转述："儿寒乎？欲食乎？"——六个字，是他母亲留在世上唯一的声音。写到这，"余泣，妪亦泣"。

全文四次写哭，却处处收着写。祖母关门、取象笏，都是小动作；妻子学书、转述小妹的问话，都是家常话。真正的深情不喊出来，藏在门板声里、手板里。

最出名的是结尾。写到枇杷树，笔就停了：树是妻子死那年亲手种的，如今已经高挺如伞。多少年了？他不说。想不想她？也不说。说不出口的思念，全交给一棵树站在院子里。

中国文学里最克制的结尾，秘密全在"不言"二字。`,
    related: ['a19', 'a15', 'a7']
  }

// 4个主题 · 星图节点位置
const THEMES = [
  { id: 'adventure', name: '冒 险', pos: [140, 120] },
  { id: 'solitude',  name: '孤 独', pos: [470, 90] },
  { id: 'courage',   name: '勇 气', pos: [600, 290] },
  { id: 'secret',    name: '秘 密', pos: [230, 310] }
];

// 5种文体印章
const FORMS = ['小说', '历史', '科普', '诗歌', '传记'];

// ============================================================
// localStorage 持久化
// ============================================================
const LS_KEY = 'reading_quest_v1';

function loadAll() {
  try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; }
  catch (e) { return {}; }
}
function saveAll(data) {
  try { localStorage.setItem(LS_KEY, JSON.stringify(data)); }
  catch (e) { console.warn('localStorage 保存失败', e); }
}

// 全局状态
let state = {
  users: [],          // [{id, name}]
  currentUserId: null,
  reads: {}           // userId -> { articleId: true }
};

function loadState() {
  const data = loadAll();
  state.users = data.users || [];
  state.currentUserId = data.currentUserId || null;
  state.reads = data.reads || {};
}
function saveState() {
  saveAll({ users: state.users, currentUserId: state.currentUserId, reads: state.reads });
}

function getUserReads() {
  if (!state.currentUserId) return {};
  if (!state.reads[state.currentUserId]) state.reads[state.currentUserId] = {};
  return state.reads[state.currentUserId];
}
function isRead(articleId) { return !!getUserReads()[articleId]; }
function isThemeLit(themeId) {
  const arts = ARTICLES.filter(a => a.theme === themeId);
  if (arts.length === 0) return false;
  return arts.every(a => isRead(a.id));
}
function countLitThemes() { return THEMES.filter(t => isThemeLit(t.id)).length; }

// ============================================================
// 视图切换
// ============================================================
function switchView(viewId) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(viewId).classList.add('active');

  const topbar = document.getElementById('topbar');
  if (viewId === 'view-launch') {
    topbar.classList.remove('visible');
  } else {
    topbar.classList.add('visible');
    const u = state.users.find(x => x.id === state.currentUserId);
    document.getElementById('current-user-name').textContent = u ? u.name : '—';
  }

  document.querySelectorAll('#topbar .icon-btn').forEach(b => b.classList.remove('active'));
  if (viewId === 'view-map')      document.getElementById('btn-map').classList.add('active');
  else if (viewId === 'view-ranking')  document.getElementById('btn-ranking').classList.add('active');
  else if (viewId === 'view-passport') document.getElementById('btn-passport').classList.add('active');

  window.scrollTo({ top: 0, behavior: 'instant' });
}

// ============================================================
// 启动屏 · 多用户切换
// ============================================================
function hashHue(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;
  return h % 360;
}

function renderUsers() {
  const grid = document.getElementById('users-grid');
  grid.innerHTML = '';

  state.users.forEach(u => {
    const div = document.createElement('div');
    div.className = 'user-slot';
    const initial = u.name.slice(0, 1).toUpperCase();
    const hue = hashHue(u.name);
    div.innerHTML = `
      <div class="avatar" style="background:hsl(${hue},28%,16%);border-color:hsl(${hue},28%,32%);color:hsl(${hue},40%,82%)">${initial}</div>
      <div class="name">${u.name}</div>
    `;
    div.addEventListener('click', () => {
      state.currentUserId = u.id;
      saveState();
      switchView('view-map');
      renderMap();
    });
    grid.appendChild(div);
  });

  if (state.users.length < 6) {
    const add = document.createElement('div');
    add.className = 'user-slot add';
    add.innerHTML = `<div class="avatar">+</div><div class="name">新旅人</div>`;
    add.addEventListener('click', () => {
      document.getElementById('add-user-modal').classList.add('open');
      setTimeout(() => document.getElementById('new-user-input').focus(), 50);
    });
    grid.appendChild(add);
  }
}

// ============================================================
// 探索地图
// ============================================================
function renderMap() {
  document.getElementById('lit-count').textContent = countLitThemes();
  document.getElementById('lit-total').textContent = THEMES.length;

  const svg = document.getElementById('star-svg');
  svg.innerHTML = '';
  const ns = 'http://www.w3.org/2000/svg';

  // 节点间弱连接线（虚线）
  for (let i = 0; i < THEMES.length; i++) {
    for (let j = i + 1; j < THEMES.length; j++) {
      const a = THEMES[i], b = THEMES[j];
      const line = document.createElementNS(ns, 'line');
      line.setAttribute('x1', a.pos[0]); line.setAttribute('y1', a.pos[1]);
      line.setAttribute('x2', b.pos[0]); line.setAttribute('y2', b.pos[1]);
      line.setAttribute('stroke', '#2a2825');
      line.setAttribute('stroke-width', '1');
      line.setAttribute('stroke-dasharray', '2 5');
      svg.appendChild(line);
    }
  }

  // 节点
  THEMES.forEach(r => {
    const lit = isThemeLit(r.id);
    const g = document.createElementNS(ns, 'g');
    g.setAttribute('class', 'star-node' + (lit ? ' lit' : ''));
    g.setAttribute('data-theme', r.id);
    g.setAttribute('transform', `translate(${r.pos[0]},${r.pos[1]})`);

    const cnt = ARTICLES.filter(a => a.theme === r.id).length;
    g.innerHTML = `
      <circle class="outer" r="30"/>
      <circle class="inner" r="5"/>
      <text class="region-name" y="54">${r.name}</text>
      <text class="region-count" y="72">${cnt} 篇</text>
    `;
    g.addEventListener('click', () => openTheme(r.id));
    svg.appendChild(g);
  });

  document.getElementById('region-panel').classList.remove('open');

  // 事件委托兜底：SVG 元素事件冒泡保险
  svg.addEventListener('click', (e) => {
    let node = e.target;
    while (node && node !== svg) {
      if (node.classList && node.classList.contains('star-node')) {
        openTheme(node.dataset.theme);
        return;
      }
      node = node.parentNode;
    }
  });
}

function openTheme(themeId) {
  const theme = THEMES.find(t => t.id === themeId);
  const arts = ARTICLES.filter(a => a.theme === themeId);
  document.getElementById('region-title').textContent = theme.name + ' · ' + arts.length + ' 篇';

  const container = document.getElementById('region-articles');
  container.innerHTML = '';
  arts.forEach(a => {
    const div = document.createElement('div');
    div.className = 'article-row' + (isRead(a.id) ? ' read' : '');
    div.innerHTML = `
      <div class="meta">
        <div class="title">${a.title}</div>
        <div class="form">${a.form}</div>
      </div>
      <div class="word-count">${a.wordCount} 字</div>
    `;
    div.addEventListener('click', () => openArticle(a.id));
    container.appendChild(div);
  });

  const panel = document.getElementById('region-panel');
  panel.classList.add('open');
  setTimeout(() => panel.scrollIntoView({ behavior: 'smooth', block: 'start' }), 60);
}

// ============================================================
// 文章详情 · 关联跳转
// ============================================================
function openArticle(articleId) {
  const a = ARTICLES.find(x => x.id === articleId);
  if (!a) return;

  const read = isRead(a.id);
  const container = document.getElementById('article-container');

  const paragraphs = a.content.split('\n\n').map(p => p.trim()).filter(Boolean);
  const bodyHTML = paragraphs.map(p => `<p>${p.replace(/\n/g, '<br>')}</p>`).join('');

  const relatedHTML = a.related.map(rid => {
    const r = ARTICLES.find(x => x.id === rid);
    if (!r) return '';
    return `
      <div class="related-item" data-id="${r.id}">
        <div>
          <div class="title">${r.title}</div>
          <div class="form">${r.form}</div>
        </div>
        <div class="arrow">→</div>
      </div>`;
  }).join('');

  container.innerHTML = `
    <div class="article-meta">
      <span class="form">${a.form}</span>
      <span>${a.wordCount} 字</span>
      <span>约 ${Math.ceil(a.wordCount / 300)} 分钟</span>
    </div>
    <h1 class="article-title">${a.title}</h1>
    <div class="article-body">${bodyHTML}</div>
    <div class="article-actions">
      <button class="btn-light ${read ? 'lit' : ''}" id="btn-light" data-id="${a.id}">
        ${read ? '已 点 亮' : '读 完 · 点 亮 此 文'}
      </button>
    </div>
    <div class="related">
      <div class="related-label">— 关 联 探 索 —</div>
      <div class="related-list">${relatedHTML}</div>
    </div>
  `;

  if (!read) {
    document.getElementById('btn-light').addEventListener('click', (e) => {
      const id = e.currentTarget.dataset.id;
      const reads = getUserReads();
      reads[id] = true;
      saveState();
      openArticle(id);
      renderMap();
    });
  }

  container.querySelectorAll('.related-item').forEach(el => {
    el.addEventListener('click', () => openArticle(el.dataset.id));
  });

  switchView('view-article');
}

// ============================================================
// 探索榜 · 按主题点亮数排名
// ============================================================
function renderRanking() {
  const list = document.getElementById('ranking-list');
  list.innerHTML = '';

  if (state.users.length === 0) {
    list.innerHTML = '<div style="text-align:center;color:var(--fg-3);padding:48px 0;font-family:var(--font-mono);font-size:12px;letter-spacing:0.2em;">还 没 有 旅 人</div>';
    return;
  }

  const ranked = state.users.map(u => {
    const reads = state.reads[u.id] || {};
    const readCount = Object.keys(reads).filter(k => reads[k]).length;
    const litCount = THEMES.filter(r => {
      const arts = ARTICLES.filter(a => a.theme === r.id);
      return arts.length > 0 && arts.every(a => reads[a.id]);
    }).length;
    return { ...u, readCount, litCount };
  }).sort((a, b) => b.litCount - a.litCount || b.readCount - a.readCount);

  ranked.forEach((u, i) => {
    const div = document.createElement('div');
    div.className = 'rank-row' + (i < 3 ? ' top' : '') + (u.id === state.currentUserId ? ' me' : '');
    const numStr = (i < 3 ? '0' : '') + (i + 1);
    div.innerHTML = `
      <div class="num">${numStr}</div>
      <div class="name">${u.name}${u.id === state.currentUserId ? ' · 我' : ''}</div>
      <div class="stats">点亮 <strong>${u.litCount}</strong> / ${THEMES.length}</div>
      <div class="stats">读 <strong>${u.readCount}</strong> 篇</div>
    `;
    list.appendChild(div);
  });
}

// ============================================================
// 护照 · 文体印章
// ============================================================
function renderPassport() {
  const grid = document.getElementById('stamp-grid');
  grid.innerHTML = '';

  const reads = getUserReads();

  FORMS.forEach(form => {
    const matched = ARTICLES.filter(a => a.form.includes(form));
    const readCount = matched.filter(a => reads[a.id]).length;
    const collected = matched.length > 0 && readCount === matched.length;

    const div = document.createElement('div');
    div.className = 'stamp' + (collected ? ' collected' : '');
    div.innerHTML = `
      <div class="seal">${form.slice(0, 1)}</div>
      <div class="form-name">${form}</div>
      <div class="count">${readCount} / ${matched.length}</div>
    `;
    grid.appendChild(div);
  });

  const list = document.getElementById('passport-list');
  list.innerHTML = '';
  const readArts = ARTICLES.filter(a => reads[a.id]);

  if (readArts.length === 0) {
    list.innerHTML = '<div class="passport-row empty">尚 未 收 集 任 何 文 章</div>';
    return;
  }

  readArts.forEach(a => {
    const div = document.createElement('div');
    div.className = 'passport-row';
    div.innerHTML = `
      <div>
        <div class="value">${a.title}</div>
        <div class="label">${a.form} · ${a.wordCount}字</div>
      </div>
      <div class="label">已 收</div>
    `;
    list.appendChild(div);
  });
}

// ============================================================
// 添加用户模态
// ============================================================
function setupAddUser() {
  const modal = document.getElementById('add-user-modal');
  const input = document.getElementById('new-user-input');

  document.getElementById('cancel-add').addEventListener('click', () => {
    modal.classList.remove('open');
    input.value = '';
  });
  document.getElementById('confirm-add').addEventListener('click', () => {
    const name = input.value.trim();
    if (!name) return;
    const id = 'u' + Date.now();
    state.users.push({ id, name });
    state.currentUserId = id;
    state.reads[id] = {};
    saveState();
    modal.classList.remove('open');
    input.value = '';
    switchView('view-map');
    renderMap();
  });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('confirm-add').click();
    if (e.key === 'Escape') { modal.classList.remove('open'); input.value = ''; }
  });

  // 事件委托兜底：防止某些环境下元素级监听失效
  document.addEventListener('click', (e) => {
    const slot = e.target.closest('.user-slot.add');
    if (slot && !modal.classList.contains('open')) {
      modal.classList.add('open');
      setTimeout(() => input.focus(), 50);
    }
  });
}

// ============================================================
// 顶部导航
// ============================================================
function setupTopbar() {
  document.getElementById('btn-home').addEventListener('click', () => {
    state.currentUserId = null;
    saveState();
    switchView('view-launch');
    renderUsers();
  });
  document.getElementById('btn-map').addEventListener('click', () => {
    switchView('view-map');
    renderMap();
  });
  document.getElementById('btn-ranking').addEventListener('click', () => {
    switchView('view-ranking');
    renderRanking();
  });
  document.getElementById('btn-passport').addEventListener('click', () => {
    switchView('view-passport');
    renderPassport();
  });
}

// ============================================================
// 初始化
// ============================================================
function init() {
  loadState();
  setupTopbar();
  setupAddUser();
  renderUsers();

  if (state.currentUserId && state.users.find(u => u.id === state.currentUserId)) {
    switchView('view-map');
    renderMap();
  } else {
    switchView('view-launch');
  }
}

init();
</script>
